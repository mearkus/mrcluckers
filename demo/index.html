<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mr. Cluckers - platformer demo</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #1b1d22; color: #cdd2d8;
    font: 14px/1.5 system-ui, sans-serif;
    overscroll-behavior: none; -webkit-text-size-adjust: 100%;
  }
  body {
    height: 100dvh; display: flex; flex-direction: column;
    align-items: center; gap: 10px; padding: 14px;
    box-sizing: border-box;
  }
  .stage-wrap {
    flex: 1 1 auto; width: 100%; max-width: 1100px; min-height: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #stage {
    image-rendering: pixelated; border-radius: 8px; display: block;
    background: #8ec5e8; touch-action: none;
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
  }
  .row {
    display: flex; gap: 18px; flex-wrap: wrap; justify-content: center;
    flex: 0 0 auto;
  }
  kbd {
    background: #2f333b; border: 1px solid #444a55; border-bottom-width: 2px;
    border-radius: 4px; padding: 1px 6px; font: inherit; font-size: 12px;
  }
  /* On a touch device the on-screen buttons replace the key legend. They are
     fixed and translucent, so the play area centres in the full height and the
     buttons float over the corners the way a mobile game's do. */
  body.touch .row { display: none; }
  body.touch { padding: 8px; }

  /* Title, level select and the end-of-level panel. Plain DOM, so the
     buttons work with a finger and a mouse without a second input path. */
  body.shell-on .stage-wrap, body.shell-on .row { display: none; }
  #shell, #done {
    position: fixed; inset: 0; z-index: 60; overflow: auto;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; box-sizing: border-box;
    background: radial-gradient(120% 90% at 50% 0%, #2a3340 0%, #14171c 70%);
  }
  #done { background: rgba(10, 12, 15, .82); }
  /* `hidden` sets display:none from the UA sheet, which the rule above beats
     on specificity -- so without this the end-of-level panel stays live,
     invisible, over the whole viewport, dimming the game and swallowing
     every click. */
  #shell[hidden], #done[hidden] { display: none !important; }

  /* Moving between levels is a page load, so the join is covered from both
     sides: fade up before navigating, and start the next page already
     covered and fade it down. The level's name sits on the cover, which is
     what turns a hard cut into an announcement. */
  #fade {
    position: fixed; inset: 0; z-index: 80; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    background: #0f1216; opacity: 0; transition: opacity .42s ease;
    font: 700 clamp(20px, 5vw, 34px)/1.2 system-ui, sans-serif; color: #f4f6f8;
  }
  #fade.up { opacity: 1; pointer-events: auto; }
  #fade span { opacity: 0; transition: opacity .3s ease .06s; }
  #fade.up span { opacity: 1; }
  /* Reduced motion still wants the cover, just without the slow crossfade. */
  @media (prefers-reduced-motion: reduce) {
    #fade, #fade span { transition-duration: .01s; }
  }
  /* Always-there controls: pause and sound. Small, out of the way, and
     reachable with a thumb -- there is no menu bar to hang them off. */
  #topbar { position: fixed; top: 0; right: 0; z-index: 70;
            display: flex; gap: 6px; padding: 10px; }
  #topbar button {
    font: 14px/1 system-ui, sans-serif; width: 38px; height: 38px;
    border-radius: 999px; cursor: pointer; color: #e8edf2;
    border: 1px solid rgba(244,246,248,.28); background: rgba(24,28,34,.55);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  #topbar button[hidden] { display: none; }
  body.shell-on #pauseBtn { display: none; }

  #paused {
    position: fixed; inset: 0; z-index: 75;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; box-sizing: border-box; background: rgba(10, 12, 15, .82);
  }
  #paused[hidden] { display: none !important; }
  #paused .done-inner { animation: rise .2s ease both; }
  #done .done-inner { animation: rise .28s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  .shell-inner, .done-inner {
    width: 100%; max-width: 520px; text-align: center;
    display: flex; flex-direction: column; gap: 12px;
  }
  #shell h1 { margin: 0; font-size: clamp(30px, 8vw, 54px); letter-spacing: .01em;
              color: #f4f6f8; }
  #done h2 { margin: 0; font-size: clamp(20px, 5vw, 30px); color: #f4f6f8; }
  .tag { margin: 0; color: #9fb0c0; }
  button.big, button.quiet, .lvl {
    font: inherit; border-radius: 10px; cursor: pointer;
    border: 1px solid #444a55; background: #262b33; color: #e8edf2;
    padding: 12px 16px; text-align: left;
  }
  button.big {
    text-align: center; font-weight: 700; font-size: 17px;
    background: #cf2027; border-color: #cf2027; color: #fff;
  }
  button.quiet { text-align: center; background: transparent; color: #9fb0c0; }
  .lvl-list { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
  .lvl { display: grid; grid-template-columns: 1fr auto; align-items: center;
         gap: 2px 10px; }
  .lvl b { grid-column: 1; font-size: 16px; }
  .lvl small { grid-column: 1; color: #9fb0c0; }
  .lvl .tick { grid-column: 2; grid-row: 1 / span 2; color: #5da041;
               font-size: 20px; }
  .lvl.locked { opacity: .45; cursor: default; }
</style>
</head>
<body>
<div id="topbar">
  <button id="pauseBtn" type="button" aria-label="Pause" hidden>&#10073;&#10073;</button>
  <button id="muteBtn" type="button" aria-label="Sound">&#128266;</button>
</div>
<div id="paused" hidden></div>
<div id="fade" class="up"><span></span></div>
<div id="shell" hidden></div>
<div id="done" hidden></div>
<div class="stage-wrap"><canvas id="stage"></canvas></div>
<div class="row">
  <span><kbd>&larr;</kbd><kbd>&rarr;</kbd> move</span>
  <span><kbd>Space</kbd> jump</span>
  <span><kbd>&darr;</kbd> crouch / walk</span>
  <span><kbd>X</kbd> peck</span>
  <span><kbd>C</kbd> crow</span>
  <span><kbd>Z</kbd> squeak</span>
  <span><kbd>V</kbd> tumble</span>
  <span><b id="levelName">&nbsp;</b></span>
  <span>state: <b id="state">idle</b></span>
</div>
<script src="../shared/jump.js"></script>
<script src="../shared/level.js"></script>
<script src="../levels/levels.js"></script>
<script src="../shared/progress.js"></script>
<script src="../shared/sound.js"></script>
<script src="../shared/theme.js"></script>
<script src="../shared/patrol.js"></script>
<script src="../shared/checkpoint.js"></script>
<script src="../shared/distraction.js"></script>
<script src="../shared/thief.js"></script>
<script src="../shared/bonus.js"></script>
<script src="../shared/controls.js"></script>
<script src="../assets/sprites/mrcluckers_side.js"></script>
<script src="../assets/sprites/ginger_side.js"></script>
<script src="shell.js"></script>
<script src="game.js"></script>
</body>
</html>
