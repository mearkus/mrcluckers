<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mr. Cluckers - platformer demo</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #1b1d22; color: #cdd2d8;
    font: 14px/1.5 system-ui, sans-serif;
    overscroll-behavior: none; -webkit-text-size-adjust: 100%;
  }
  body {
    height: 100dvh; display: flex; flex-direction: column;
    align-items: center; gap: 10px; padding: 14px;
    box-sizing: border-box;
  }
  .stage-wrap {
    flex: 1 1 auto; width: 100%; max-width: 1100px; min-height: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #stage {
    image-rendering: pixelated; border-radius: 8px; display: block;
    background: #8ec5e8; touch-action: none;
    box-shadow: 0 12px 40px rgba(0,0,0,.5);
  }
  .row {
    display: flex; gap: 18px; flex-wrap: wrap; justify-content: center;
    flex: 0 0 auto;
  }
  kbd {
    background: #2f333b; border: 1px solid #444a55; border-bottom-width: 2px;
    border-radius: 4px; padding: 1px 6px; font: inherit; font-size: 12px;
  }
  /* On a touch device the on-screen buttons replace the key legend. They are
     fixed and translucent, so the play area centres in the full height and the
     buttons float over the corners the way a mobile game's do. */
  body.touch .row { display: none; }
  body.touch { padding: 8px; }

  /* Title, level select and the end-of-level panel. Plain DOM, so the
     buttons work with a finger and a mouse without a second input path. */
  body.shell-on .stage-wrap, body.shell-on .row { display: none; }
  #shell, #done {
    position: fixed; inset: 0; z-index: 60; overflow: auto;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; box-sizing: border-box;
  }
  /* Warm light pooled low and left, where the two of them stand, against a
     cool night sky. A grey rooster and a tan dog both disappear into a grey
     background; against warm-on-cool they read instantly. */
  #shell {
    background:
      radial-gradient(70% 55% at 26% 74%, rgba(255,188,112,.20), transparent 62%),
      radial-gradient(130% 105% at 50% -12%, #27334c 0%, #141a26 52%, #0c1015 100%);
  }
  #done { background: rgba(10, 12, 15, .82); }
  /* `hidden` sets display:none from the UA sheet, which the rule above beats
     on specificity -- so without this the end-of-level panel stays live,
     invisible, over the whole viewport, dimming the game and swallowing
     every click. */
  #shell[hidden], #done[hidden] { display: none !important; }

  /* Moving between levels is a page load, so the join is covered from both
     sides: fade up before navigating, and start the next page already
     covered and fade it down. The level's name sits on the cover, which is
     what turns a hard cut into an announcement. */
  #fade {
    position: fixed; inset: 0; z-index: 80; pointer-events: none;
    display: flex; align-items: center; justify-content: center;
    background: #0f1216; opacity: 0; transition: opacity .42s ease;
    font: 700 clamp(20px, 5vw, 34px)/1.2 system-ui, sans-serif; color: #f4f6f8;
  }
  #fade.up { opacity: 1; pointer-events: auto; }
  #fade span { opacity: 0; transition: opacity .3s ease .06s; }
  #fade.up span { opacity: 1; }
  /* Reduced motion still wants the cover, just without the slow crossfade. */
  @media (prefers-reduced-motion: reduce) {
    #fade, #fade span { transition-duration: .01s; }
  }
  /* Always-there controls: pause and sound. Small, out of the way, and
     reachable with a thumb -- there is no menu bar to hang them off. */
  #topbar { position: fixed; top: 0; right: 0; z-index: 70;
            display: flex; gap: 6px; padding: 10px; }
  #topbar button {
    font: 14px/1 system-ui, sans-serif; width: 38px; height: 38px;
    border-radius: 999px; cursor: pointer; color: #e8edf2;
    border: 1px solid rgba(244,246,248,.28); background: rgba(24,28,34,.55);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  #topbar button[hidden] { display: none; }
  body.shell-on #pauseBtn { display: none; }

  #paused {
    position: fixed; inset: 0; z-index: 75;
    display: flex; align-items: center; justify-content: center;
    padding: 24px; box-sizing: border-box; background: rgba(10, 12, 15, .82);
  }
  #paused[hidden] { display: none !important; }
  #paused .done-inner { animation: rise .2s ease both; }
  #done .done-inner { animation: rise .28s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  /* ------------------------------------------------------ title screen */
  /* Two panels: the pair on the left, looking across at the menu on the
     right. Below 860px the grid collapses to one column and the art becomes
     a band across the top, so the buttons stay where a thumb expects them. */
  .title-page {
    width: 100%; max-width: 1160px; margin: auto;
    display: grid; gap: clamp(8px, 3vw, 44px); align-items: center;
    grid-template-columns: minmax(0, 1.2fr) minmax(300px, 25rem);
  }
  /* `align-items: center` is load-bearing: a stretched flex item would make
     the box taller than the art it contains, and the contact shadow -- which
     is placed against the bottom of the box -- would then sit in empty space
     below their feet. */
  .title-art { position: relative; display: flex;
               justify-content: center; align-items: center; }
  .title-art img {
    position: relative; z-index: 1; width: 100%; height: auto;
    max-height: min(74vh, 700px); object-fit: contain;
    filter: drop-shadow(0 18px 26px rgba(0,0,0,.45));
    opacity: 0; transform: translateY(14px) scale(.985);
    transition: opacity .5s ease, transform .5s ease;
  }
  .title-art.in img { opacity: 1; transform: none; }
  /* A pool of light behind them and a contact shadow under them. Without
     the shadow the cut-out render floats; with it they stand somewhere. */
  .title-art .glow {
    position: absolute; inset: 6% 4% 2%; z-index: 0; pointer-events: none;
    background: radial-gradient(52% 46% at 50% 62%,
                rgba(255,206,146,.30), rgba(255,206,146,.06) 58%, transparent 72%);
  }
  .title-art .shadow {
    position: absolute; z-index: 2; pointer-events: none;
    left: 12%; right: 12%; bottom: 2%; height: 5%;
    border-radius: 50%; background: rgba(6,9,14,.5); filter: blur(11px);
  }

  .shell-inner, .done-inner {
    width: 100%; max-width: 520px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .done-inner { text-align: center; max-width: 420px; margin: auto; }
  #done h2 { margin: 0; font-size: clamp(20px, 5vw, 30px); color: #f4f6f8; }
  .tag { margin: 0; color: #9fb0c0; }

  #shell h1 {
    margin: 0 0 2px; display: flex; flex-direction: column;
    font-size: clamp(38px, 7.5vw, 66px); line-height: .96;
    color: #f6f8fa;
  }
  #shell h1 .wm-small {
    font-size: .27em; font-weight: 700; letter-spacing: .22em;
    text-transform: uppercase; color: #e8746f; margin-bottom: .5em;
    /* Tracking adds a trailing gap the size of one space, which pulls the
       glyphs left of centre when the column is centred. Take it back. */
    margin-right: -.22em;
  }
  #shell h1 .wm-big {
    font-weight: 800; letter-spacing: -.02em;
    text-shadow: 0 2px 0 rgba(0,0,0,.28), 0 14px 30px rgba(0,0,0,.4);
  }
  #shell .tag { max-width: 30rem; text-wrap: balance; }

  button.big, button.quiet, .lvl {
    font: inherit; border-radius: 12px; cursor: pointer;
    border: 1px solid rgba(255,255,255,.14);
    background: rgba(255,255,255,.055); color: #e8edf2;
    padding: 12px 16px; text-align: left;
    transition: background .15s ease, border-color .15s ease,
                transform .12s ease, box-shadow .15s ease;
  }
  button.big {
    margin-top: 8px; text-align: center; font-weight: 700; font-size: 18px;
    color: #fff; border-color: transparent; padding: 14px 18px;
    background: linear-gradient(180deg, #e0333a, #bf1c23);
    box-shadow: 0 8px 20px rgba(191,28,35,.34);
    display: flex; flex-direction: column; gap: 1px; align-items: center;
  }
  /* "Continue" carries the level you would drop back into, so the button
     answers "continue what?" without a second line of prose above it. */
  button.big small { font-weight: 500; font-size: 12px; opacity: .82; }
  button.big:hover { background: linear-gradient(180deg, #ec3f46, #cd2129); }
  button.quiet {
    text-align: center; background: transparent; border-color: transparent;
    color: #8b9cad; padding: 8px;
  }
  button.quiet:hover { color: #cdd6df; background: rgba(255,255,255,.05); }
  .lvl:hover:not(.locked) {
    background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.24);
  }
  button.big:active, .lvl:active:not(.locked) { transform: translateY(1px); }
  button:focus-visible, .lvl:focus-visible {
    outline: 2px solid #ffc987; outline-offset: 2px;
  }

  .lvl-list { display: flex; flex-direction: column; gap: 7px; margin-top: 12px; }
  .lvl {
    display: grid; grid-template-columns: auto 1fr auto;
    align-items: center; gap: 0 12px; padding: 9px 13px;
  }
  .lvl .num {
    grid-row: 1; width: 26px; height: 26px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: #cfd8e2;
    background: rgba(255,255,255,.08);
  }
  .lvl.beat .num { background: rgba(93,160,65,.24); color: #a6dd8e; }
  .lvl .body { display: flex; flex-direction: column; min-width: 0; }
  .lvl b { font-size: 15px; }
  .lvl small { color: #92a3b4; }
  .lvl .tick { color: #6fbb4f; font-size: 18px; }
  .lvl.locked { opacity: .42; cursor: default; }
  .lvl.locked .num { background: transparent; font-size: 15px; }

  @media (max-width: 860px) {
    .title-page { grid-template-columns: 1fr; justify-items: center; }
    .title-art img { max-height: 32vh; }
    .title-art .glow { inset: 0 10%; }
    .shell-inner { text-align: center; align-items: stretch; }
    #shell h1 { align-items: center; }
    #shell .tag { margin-inline: auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    .title-art img { transition: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body>
<div id="topbar">
  <button id="pauseBtn" type="button" aria-label="Pause" hidden>&#10073;&#10073;</button>
  <button id="muteBtn" type="button" aria-label="Sound">&#128266;</button>
</div>
<div id="paused" hidden></div>
<div id="fade" class="up"><span></span></div>
<div id="shell" hidden></div>
<div id="done" hidden></div>
<div class="stage-wrap"><canvas id="stage"></canvas></div>
<div class="row">
  <span><kbd>&larr;</kbd><kbd>&rarr;</kbd> move</span>
  <span><kbd>Space</kbd> jump</span>
  <span><kbd>&darr;</kbd> crouch / walk</span>
  <span><kbd>X</kbd> peck</span>
  <span><kbd>C</kbd> crow</span>
  <span><kbd>Z</kbd> squeak</span>
  <span><kbd>V</kbd> tumble</span>
  <span><b id="levelName">&nbsp;</b></span>
  <span>state: <b id="state">idle</b></span>
</div>
<script src="../shared/jump.js"></script>
<script src="../shared/level.js"></script>
<script src="../levels/levels.js"></script>
<script src="../shared/progress.js"></script>
<script src="../shared/sound.js"></script>
<script src="../shared/theme.js"></script>
<script src="../shared/patrol.js"></script>
<script src="../shared/checkpoint.js"></script>
<script src="../shared/distraction.js"></script>
<script src="../shared/thief.js"></script>
<script src="../shared/bonus.js"></script>
<script src="../shared/controls.js"></script>
<script src="../assets/sprites/mrcluckers_side.js"></script>
<script src="../assets/sprites/ginger_side.js"></script>
<script src="shell.js"></script>
<script src="game.js"></script>
</body>
</html>
