<!doctype html>
<meta charset="utf-8">
<title>Mr. Cluckers - three.js</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
  html, body { margin: 0; height: 100%; background: #9cc3dc; overflow: hidden;
               font: 13px/1.5 system-ui, sans-serif; color: #eaf0f4;
               overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
  /* 100dvh so the mobile browser's collapsing toolbar doesn't clip the view. */
  body { height: 100dvh; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hud { position: fixed; left: 0; right: 0; top: 0; padding: 10px 14px;
         display: flex; gap: 8px 18px; flex-wrap: wrap; align-items: center;
         background: linear-gradient(rgba(8,10,14,.75), transparent);
         padding-top: calc(10px + env(safe-area-inset-top, 0px));
         pointer-events: none; }
  body.touch #hud .keyhint { display: none; }
  #rotate { position: fixed; left: 50%; top: 14px; transform: translateX(-50%);
            padding: 7px 14px; border-radius: 999px; font-size: 12px;
            background: rgba(8,10,14,.6); display: none; pointer-events: none;
            padding-top: calc(7px + env(safe-area-inset-top, 0px)); }
  body.touch.portrait #rotate { display: block; }
  body.touch.portrait #hud { display: none; }
  kbd { background: #232831; border: 1px solid #3a414c; border-bottom-width: 2px;
        border-radius: 3px; padding: 1px 6px; font: 11px monospace; }
  b { color: #f0f3f6; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center;
             color: #2c3d4a; font-size: 14px; letter-spacing: .1em;
             text-transform: uppercase; }
  /* Said once, at the start of the bonus round, because nothing else
     explains it. */
  #prompt { position: fixed; left: 0; right: 0; top: 16%; text-align: center;
            background: rgba(20, 26, 32, .55); padding: 14px 10px;
            pointer-events: none; font-family: system-ui, sans-serif; }
  #prompt b { display: block; color: #fffae1; font-size: clamp(15px, 3.2vw, 26px); }
  #prompt span { display: block; margin-top: 6px; color: #d2e6f5;
                 font-size: clamp(11px, 2.2vw, 16px); }
</style>
<div id="loading">Loading&hellip;</div>
<div id="hud" hidden>
  <span class="keyhint"><kbd>&larr;</kbd><kbd>&rarr;</kbd> move</span>
  <span class="keyhint"><kbd>space</kbd> jump</span>
  <span class="keyhint"><kbd>&darr;</kbd> crouch</span>
  <span class="keyhint"><kbd>x</kbd> peck</span>
  <span class="keyhint"><kbd>c</kbd> crow</span>
  <span class="keyhint"><kbd>z</kbd> squeak</span>
  <span class="keyhint"><kbd>v</kbd> tumble</span>
  <span><b id="levelName">&nbsp;</b></span>
  <span>state <b id="state">idle</b></span>
  <span><b id="fps">--</b> fps</span>
</div>
<div id="rotate">Turn sideways for a wider view</div>
<div id="prompt" hidden>
  <b>She&rsquo;s going to throw him &mdash; steer with &#9664; &#9654;</b>
  <span>sweep up the treats, or land on the ring to be caught</span>
</div>
<script src="../shared/jump.js"></script>
<script src="../shared/level.js"></script>
<script src="../levels/levels.js"></script>
<script src="../shared/patrol.js"></script>
<script src="../shared/bonus.js"></script>
<script src="../shared/controls.js"></script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { Cluckers, sideCamera, resizeSideCamera, plushLighting }
  from './mrcluckers.js';

// --- physics, in world units (he is 1.0 unit tall) ------------------------
// Derived from shared/jump.js so the two demos and the editor agree.
const J = window.Jump.C;
const GRAVITY = J.GRAVITY, RUN = J.RUN, WALK = J.WALK;
const ACCEL = J.ACCEL, FRICTION = J.FRICTION;
const JUMPV = J.JUMP_VELOCITY, COYOTE = J.COYOTE, BUFFER = J.JUMP_BUFFER;
const HALF_W = J.HALF_WIDTH;

// Frame by how much of the level should be visible horizontally, not by a
// fixed height -- otherwise a tall phone screen shows almost nothing ahead.
const MIN_WORLD_WIDTH = 6.0, MIN_VIEW_H = 3.6, MAX_VIEW_H = 7.0;

// Actions normally end when their clip does, but `tumble` loops, so it needs
// an explicit limit or he spins forever. Roughly two turns of the clip.
const ACTION_TIME = { tumble: 1.2 };
const ACTION_KEYS = ['peck', 'crow', 'squeak', 'tumble'];

// --- bonus round ----------------------------------------------------------
// Once they are reunited she throws him and you steer. The rules come from
// shared/bonus.js, the same file the sprite demo runs, so the two play the
// same game rather than merely looking alike.
const BONUS_DELAY = 1.4;        // beat between the greeting and act two
let bonus = null, bonusWait = 0, treatMeshes = [];
// The box the round has to fit inside, from the physics rather than a number
// typed here -- the two drifted apart once and the toy left the screen.
let bonusBox = null, catchRing = null, landMark = null;
function measureBonus() {
  const e = window.Bonus.extent(bonus.dog.dir);
  const pad = 0.55;                       // the toy is about a unit across
  bonusBox = {
    left: LEVEL.goal.x + e.min - pad, right: LEVEL.goal.x + e.max + pad,
    top: LEVEL.goal.y + window.Bonus.arcHeight() + pad,
    bottom: LEVEL.goal.y - 0.35
  };
}
function viewHeight() {
  const aspect = innerWidth / innerHeight;
  const base = Math.min(MAX_VIEW_H, Math.max(MIN_VIEW_H, MIN_WORLD_WIDTH / aspect));
  if (!bonusBox) return base;
  // Fit the round's box outright: tall enough for the arc, and wide enough
  // for its full sideways range once the aspect is taken into account.
  return Math.max(bonusBox.top - bonusBox.bottom,
                  (bonusBox.right - bonusBox.left) / aspect);
}

// Authored in world units in levels/*.json -- the same file the canvas demo
// and the editor read, so a level only has to be designed once.
const want = (location.search.match(/[?&]level=([\w-]+)/) || [])[1];
const SLUG = (want && window.MRCLUCKERS_LEVELS[want])
  ? want : window.MRCLUCKERS_LEVEL_ORDER[0];
const LEVEL = window.Level.normalize(window.MRCLUCKERS_LEVELS[SLUG]);
const PLATFORMS = LEVEL.platforms;
const collected = new Set();

const coarse = matchMedia('(pointer: coarse)').matches;
const renderer = new THREE.WebGLRenderer({ antialias: true });
// Phones are fill-rate bound long before they are triangle bound, so cap the
// pixel ratio harder on touch devices than on desktop.
renderer.setPixelRatio(Math.min(devicePixelRatio, coarse ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#9cc3dc');
scene.fog = new THREE.Fog('#b8d3e4', 16, 40);
const camera = sideCamera(innerWidth / innerHeight, viewHeight());
plushLighting(scene);

// --- level ---------------------------------------------------------------
// A side-on orthographic camera only ever sees the front face, so the grass
// is a separate cap sitting proud of the dirt rather than a top-face material.
const dirtMat = new THREE.MeshStandardMaterial({ color: '#6b4b34', roughness: 1 });
const grassMat = new THREE.MeshStandardMaterial({ color: '#5da041', roughness: 1 });
const GRASS = 0.16;
for (const p of PLATFORMS) {
  const depth = p.ground ? 3 : 1.2;
  const dirt = new THREE.Mesh(new THREE.BoxGeometry(p.w, p.h, depth), dirtMat);
  dirt.position.set(p.x + p.w / 2, p.y - p.h / 2, 0);
  scene.add(dirt);
  const cap = new THREE.Mesh(
    new THREE.BoxGeometry(p.w, GRASS, depth + 0.06), grassMat);
  cap.position.set(p.x + p.w / 2, p.y - GRASS / 2, 0);
  scene.add(cap);
}

const kibbleMat = new THREE.MeshStandardMaterial({ color: '#c8892f', roughness: .7 });
const kibbleGeo = new THREE.SphereGeometry(0.09, 12, 8);
const kibbles = LEVEL.pickups.map((p, i) => {
  const m = new THREE.Mesh(kibbleGeo, kibbleMat);
  m.position.set(p.x, p.y + 0.18, 0);
  m.userData.index = i;
  scene.add(m);
  return m;
});

// The robot vacuum. Position comes from shared/patrol.js, so this and the
// sprite demo put it in exactly the same place at the same moment.
const vacuums = LEVEL.patrols.map((m) => {
  const R = window.Patrol.CFG.radius, H = window.Patrol.CFG.height;
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(R, R * 0.96, H, 28),
    new THREE.MeshStandardMaterial({ color: '#2b3038', roughness: .6 }));
  body.position.y = H / 2;
  g.add(body);
  const lid = new THREE.Mesh(new THREE.CylinderGeometry(R * 0.7, R * 0.7, H * 0.12, 24),
    new THREE.MeshStandardMaterial({ color: '#3d444e', roughness: .5 }));
  lid.position.y = H + H * 0.05;
  g.add(lid);
  const lamp = new THREE.Mesh(new THREE.SphereGeometry(R * 0.13, 12, 10),
    new THREE.MeshBasicMaterial({ color: 0x7fd46b }));
  lamp.position.set(0, H + H * 0.16, 0);
  g.add(lamp);
  const bumper = new THREE.Mesh(new THREE.BoxGeometry(R * 0.3, H * 0.55, R * 1.25),
    new THREE.MeshStandardMaterial({ color: '#4d5560', roughness: .6 }));
  bumper.position.set(R * 0.7, H * 0.42, 0);
  g.add(bumper);
  g.userData = { m, lamp, bumper };
  g.position.set(m.x, m.y, 0);
  scene.add(g);
  return g;
});

const waterMat = new THREE.MeshStandardMaterial({
  color: '#4a8fbe', roughness: .25, transparent: true, opacity: .75 });
for (const h of LEVEL.hazards) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(h.w, h.h, 2.4), waterMat);
  m.position.set(h.x + h.w / 2, h.y - h.h / 2, 0);
  scene.add(m);
}

// Ginger waits at the goal, facing back down the level so she is looking at
// him as he arrives.
let ginger = null;
if (LEVEL.goal) {
  const gltf = await new GLTFLoader().loadAsync('../assets/model/ginger.glb');
  const pivot = new THREE.Group();
  pivot.rotation.y = -Math.PI / 2;
  pivot.add(gltf.scene);
  const root = new THREE.Group();
  root.position.set(LEVEL.goal.x, LEVEL.goal.y, 0);
  root.add(pivot);
  scene.add(root);

  const mixer = new THREE.AnimationMixer(gltf.scene);
  const actions = {};
  for (const clip of gltf.animations) {
    const a = mixer.clipAction(clip);
    if (clip.name === 'greet') {
      a.setLoop(THREE.LoopOnce, 1);
      a.clampWhenFinished = true;
    }
    actions[clip.name] = a;
  }
  let current = actions.sit_idle.play();
  mixer.addEventListener('finished', (e) => {
    if (e.action.getClip().name === 'greet') play('wag');
  });
  function play(name, fade = 0.2) {
    const next = actions[name];
    if (!next || next === current) return;
    next.reset().play();
    current.crossFadeTo(next, fade, false);
    current = next;
  }
  ginger = { root, mixer, play };

  const shadow = new THREE.Mesh(
    new THREE.CircleGeometry(0.72, 28),
    new THREE.MeshBasicMaterial({ color: 0x24401c, transparent: true, opacity: 0.24 })
  );
  shadow.rotation.x = -Math.PI / 2;
  shadow.position.set(LEVEL.goal.x, LEVEL.goal.y + 0.012, 0);
  scene.add(shadow);
}

// A blob shadow costs nothing and suits the toy better than a shadow map.
const shadow = new THREE.Mesh(
  new THREE.CircleGeometry(0.34, 24),
  new THREE.MeshBasicMaterial({ color: 0x24401c, transparent: true, opacity: 0.3 })
);
shadow.rotation.x = -Math.PI / 2;
scene.add(shadow);

document.title = LEVEL.name + ' - Mr. Cluckers';
const bird = await Cluckers.load('../assets/model/mrcluckers.glb');
scene.add(bird.root);
document.getElementById('loading').remove();
document.getElementById('hud').hidden = false;

if (window.TouchControls && window.TouchControls.isTouch) {
  window.TouchControls.mount({
    actions: [
      { code: 'KeyX', label: 'peck' },
      { code: 'KeyC', label: 'crow' },
      { code: 'KeyZ', label: 'squeak' },
      { code: 'KeyV', label: 'tumble' }
    ]
  });
  document.body.classList.add('touch');
}
onResize();

// --- input ---------------------------------------------------------------
const keys = {}; let pressed = {};
const MAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  ArrowDown: 'down', KeyS: 'down', ArrowUp: 'jump', KeyW: 'jump', Space: 'jump',
  KeyX: 'peck', KeyC: 'crow', KeyZ: 'squeak', KeyV: 'tumble' };
addEventListener('keydown', e => {
  const k = MAP[e.code]; if (!k) return;
  if (!keys[k]) pressed[k] = true; keys[k] = true; e.preventDefault();
});
addEventListener('keyup', e => {
  const k = MAP[e.code]; if (!k) return; keys[k] = false; e.preventDefault();
});

// --- character controller (same shape as the sprite demo) -----------------
const P = { x: LEVEL.spawn.x, y: LEVEL.spawn.y, vx: 0, vy: 0, onGround: true,
            coyote: 0, buffer: 0, landTimer: 0, action: null, actionTime: 0,
            reached: false, stun: 0, hitCool: 0 };
bird.onFinished = (name) => { if (P.action === name) P.action = null; };

function pickState(crouching) {
  if (P.action) return P.action;
  if (!P.onGround) return P.vy > 0.4 ? 'jump' : 'fall';
  if (P.landTimer > 0.12) return 'land';
  if (crouching) return 'crouch';
  const s = Math.abs(P.vx);
  if (s > WALK + 0.4) return 'run';
  if (s > 0.16) return 'walk';
  return 'idle';
}

function startBonus() {
  if (!window.Bonus || !LEVEL.goal) return null;
  bonus = window.Bonus.create();
  bonus.start(LEVEL.goal.x, LEVEL.goal.y, -1);   // she throws back down the level
  // The level's own kibble would read as treats, so it steps out of the way.
  for (const k of kibbles) k.visible = false;
  measureBonus();
  onResize();

  // The stretch of ground that counts as a catch, and a marker for where he
  // will come down if you stop steering. Between them the round stops being
  // guesswork -- you can watch the marker slide as you hold a direction.
  //
  // Both stand *up* off the ground. A flat decal is the obvious way to draw a
  // landing zone and it is invisible here: this camera is side-on and
  // orthographic, so anything lying flat is edge-on and has no thickness.
  const R = bonus.cfg.catchRadius;
  catchRing = new THREE.Group();
  const zoneMat = new THREE.MeshBasicMaterial({ color: 0xfff6cf, transparent: true,
                                                opacity: 0.8 });
  const bar = new THREE.Mesh(new THREE.BoxGeometry(R * 2, 0.05, 0.05), zoneMat);
  bar.position.y = 0.03;
  catchRing.add(bar);
  for (const side of [-1, 1]) {
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.42, 0.07), zoneMat);
    post.position.set(side * R, 0.21, 0);
    catchRing.add(post);
  }
  catchRing.userData.mat = zoneMat;
  catchRing.position.set(LEVEL.goal.x, LEVEL.goal.y + 0.01, 0);
  scene.add(catchRing);

  landMark = new THREE.Mesh(
    new THREE.ConeGeometry(0.17, 0.38, 4),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.95 }));
  landMark.rotation.x = Math.PI;          // point down at the ground
  landMark.rotation.y = Math.PI / 4;      // a face toward the camera, not an edge
  scene.add(landMark);
  treatMeshes = bonus.treats.map(() => {
    const m = new THREE.Mesh(kibbleGeo, kibbleMat);
    m.scale.setScalar(1.6);
    scene.add(m);
    return m;
  });
  onResize();                                   // pull the camera back
  return bonus;
}

function updateBonus(dt) {
  bonus.update(dt, { left: keys.left, right: keys.right });

  // Each throw lays a fresh set, so the meshes follow the current list.
  if (bonus.treats.length !== treatMeshes.length) {
    for (const m of treatMeshes) scene.remove(m);
    treatMeshes = bonus.treats.map(() => {
      const m = new THREE.Mesh(kibbleGeo, kibbleMat);
      m.scale.setScalar(1.6);
      scene.add(m);
      return m;
    });
  }
  for (let i = 0; i < treatMeshes.length; i++) {
    const t = bonus.treats[i];
    // Once the last throw has landed there is nothing left to collect.
    treatMeshes[i].visible = !t.taken && bonus.phase !== 'done';
    treatMeshes[i].position.set(t.x, t.y, 0);
    treatMeshes[i].rotation.y += dt * 2.2;
  }

  if (catchRing && landMark) {
    const live = bonus.phase === 'flight';
    landMark.visible = live;
    if (live) {
      const lx = window.Bonus.predictLanding(bonus);
      const homing = Math.abs(lx - bonus.dog.x) < bonus.cfg.catchRadius;
      landMark.position.set(lx, LEVEL.goal.y + 0.26, 0);
      landMark.material.color.setHex(homing ? 0x96f08c : 0xffffff);
      catchRing.userData.mat.color.setHex(homing ? 0x96f08c : 0xfff6cf);
      catchRing.userData.mat.opacity = homing ? 1.0 : 0.8;
    }
    catchRing.visible = bonus.phase !== 'done';
  }

  for (const e of bonus.drain()) {
    if (e === 'squeak') bird.play('squeak', { restart: true });
    else if (e === 'catch') { bird.play('squeak', { restart: true });
                             if (ginger) ginger.play('greet', 0.08); }
    else if (e === 'land') bird.play('land', { restart: true });
  }

  // Show the prompt through the first wind-up only.
  document.getElementById('prompt').hidden =
    !(bonus.throwIndex === 0 && bonus.phase === 'wind');

  if (bonus.phase === 'wind' && ginger) ginger.play('greet', 0.1);
  if (ginger) ginger.mixer.update(dt);

  // He *is* the toy now: position straight from the physics, and tumbling
  // end over end the way a thrown plush does.
  P.x = bonus.toy.x; P.y = bonus.toy.y;
  bird.root.position.set(P.x, P.y, 0);
  if (bonus.phase === 'flight') {
    bird.play('tumble');
    bird.root.rotation.z = bonus.toy.spin;
  } else {
    bird.root.rotation.z = 0;
    if (bird.current.getClip().name === 'tumble') bird.play('idle');
  }
  bird.update(dt);

  shadow.position.set(P.x, LEVEL.goal.y + 0.012, 0);
  const gap = Math.max(0, P.y - LEVEL.goal.y);
  const st = Math.max(0, 1 - gap / 3.4);
  shadow.scale.setScalar(0.55 + 0.45 * st);
  shadow.material.opacity = 0.34 * st;

  // Hold the whole box still. The round is short and the arc is what you are
  // reading, so a fixed shot beats a camera chasing the toy you are aiming.
  const cx = (bonusBox.left + bonusBox.right) / 2;
  const cy = (bonusBox.top + bonusBox.bottom) / 2;
  camera.position.x += (cx - camera.position.x) * Math.min(1, dt * 6);
  camera.position.y += (cy - camera.position.y) * Math.min(1, dt * 4);

  pressed = {};
  document.getElementById('state').textContent = bird.current.getClip().name;
  document.getElementById('levelName').textContent =
    (bonus.phase === 'done'
      ? 'fetch! \u2014 final'
      : 'fetch! throw ' + Math.min(bonus.throwIndex + 1, bonus.cfg.throws) +
        '/' + bonus.cfg.throws) +
    '  score ' + bonus.score + '  \u2014 ' + bonus.treatsTaken + ' treats, ' +
    bonus.caught + ' caught';
}

let levelClock = 0;

function update(dt) {
  levelClock += dt;
  P.stun = Math.max(0, P.stun - dt);
  P.hitCool = Math.max(0, P.hitCool - dt);
  if (bonus) return updateBonus(dt);

  // The greeting plays out, then a beat, then she picks him up to throw.
  if (P.reached) {
    bonusWait += dt;
    if (bonusWait >= BONUS_DELAY && startBonus()) return;
  }

  const crouching = keys.down && P.onGround;
  // A shove from the vacuum takes the controls away for a moment.
  const steerable = P.stun <= 0;

  // Resolve any action already running first, so a cancelling press takes
  // effect on the same frame rather than the next one.
  if (P.action) {
    P.actionTime += dt;
    const limit = ACTION_TIME[P.action];
    const repeat = pressed[P.action];
    // Jumping outranks a flourish. A direction only shrugs off `tumble`,
    // which is a stun -- otherwise you could never peck on the run.
    const shrugged = repeat || pressed.jump ||
                     (P.action === 'tumble' &&
                      (pressed.left || pressed.right || pressed.down));
    const expired = limit !== undefined && P.actionTime >= limit;
    if (shrugged || expired) {
      // Don't let the same press immediately restart what it cancelled.
      if (repeat) pressed[P.action] = false;
      P.action = null;
    }
  }

  if (!P.action) {
    for (const a of ACTION_KEYS)
      if (pressed[a]) {
        P.action = a;
        P.actionTime = 0;
        bird.play(a, { restart: true });
        break;
      }
  }
  // Actions are cosmetic: they never stop the character. Movement follows the
  // keys that are *held*, so an action fired mid-run keeps the run.
  let target = 0;
  if (!crouching && steerable) { if (keys.left) target -= 1; if (keys.right) target += 1; }
  const speed = keys.down ? WALK : RUN;
  if (target !== 0) {
    P.vx += target * ACCEL * dt;
    if (Math.abs(P.vx) > speed) P.vx = target * speed;
    bird.setFacing(target);
  } else if (P.stun <= 0) {
    // While stunned he keeps whatever the vacuum gave him; friction here
    // scrubbed the shove off almost at once and the hit read as nothing.
    const drop = FRICTION * dt;
    P.vx = Math.abs(P.vx) <= drop ? 0 : P.vx - Math.sign(P.vx) * drop;
  }

  P.coyote = P.onGround ? COYOTE : Math.max(0, P.coyote - dt);
  P.buffer = pressed.jump ? BUFFER : Math.max(0, P.buffer - dt);
  if (P.buffer > 0 && P.coyote > 0) {
    P.vy = JUMPV; P.onGround = false; P.coyote = 0; P.buffer = 0;
  }
  if (P.vy > 0 && !keys.jump) P.vy -= GRAVITY * 1.6 * dt;

  P.vy -= GRAVITY * dt;
  P.x += P.vx * dt;
  const prevY = P.y;
  P.y += P.vy * dt;

  const wasAir = !P.onGround;
  P.onGround = false;
  if (P.vy <= 0) {
    for (const p of PLATFORMS) {
      if (P.x + 0.22 > p.x && P.x - 0.22 < p.x + p.w &&
          prevY >= p.y - 0.001 && P.y <= p.y) {
        P.y = p.y; P.vy = 0; P.onGround = true;
        if (wasAir) P.landTimer = 0.26;
        break;
      }
    }
  }
  // Hazards and falling out of the world put him back at the start.
  // The vacuum: drive each machine from the shared clock, then see if it
  // caught him. Not lethal -- it bats him back down the room -- and being
  // above it is safe, so the counterplay is to time the gap or jump it.
  for (const v of vacuums) {
    const { m, lamp, bumper } = v.userData;
    const here = window.Patrol.at(m, levelClock);
    v.position.x = here.x;
    bumper.position.x = here.dir * window.Patrol.CFG.radius * 0.7;
    lamp.material.color.setHex(
      here.turning ? (Math.floor(performance.now() / 180) % 2 ? 0xffd34d : 0x6b5a20)
                   : 0x7fd46b);
    if (P.hitCool > 0) continue;
    if (!window.Patrol.hits(m, levelClock, P.x, P.y, HALF_W)) continue;
    const k = window.Patrol.knockFrom(here, P.x);
    P.vx = k.vx; P.vy = k.vy; P.onGround = false; P.stun = k.stun;
    P.hitCool = window.Patrol.CFG.immune;
    P.action = 'tumble'; P.actionTime = 0;
    bird.play('tumble', { restart: true });
  }

  // He drowns when he is *in* the water, not when he is level with it: a
  // hazard's edge plus his half-width overlaps the ledge beside it, so the
  // bank itself used to be lethal and a flush water gap was uncrossable.
  let inHazard = false;
  for (const h of LEVEL.hazards)
    if (P.x + HALF_W > h.x && P.x - HALF_W < h.x + h.w &&
        P.y < h.y - 0.08 && P.y > h.y - h.h - 0.4) inHazard = true;
  if (P.y < -6 || inHazard) {
    P.x = LEVEL.spawn.x; P.y = LEVEL.spawn.y; P.vx = P.vy = 0; P.action = null;
  }

  for (const k of kibbles) {
    if (!k.visible) continue;
    if (Math.abs(k.position.x - P.x) < 0.36 &&
        Math.abs(k.position.y - (P.y + 0.5)) < 0.55) {
      k.visible = false;
      collected.add(k.userData.index);
      if (!P.action) { P.action = 'squeak'; P.actionTime = 0;
                       bird.play('squeak', { restart: true }); }
    }
  }
  if (ginger) {
    ginger.mixer.update(dt);
    if (!P.reached && Math.abs(LEVEL.goal.x - P.x) < 0.6 &&
        Math.abs(LEVEL.goal.y - P.y) < 0.9) {
      P.reached = true;
      P.action = 'crow';
      P.actionTime = 0;
      bird.play('crow', { restart: true });
      ginger.play('greet', 0.08);
    }
  }
  P.landTimer = Math.max(0, P.landTimer - dt);

  bird.play(pickState(crouching));
  bird.root.position.set(P.x, P.y, 0);
  bird.update(dt);

  // Shadow sits on whatever surface is under him and fades with height.
  let floor = -6;
  for (const p of PLATFORMS)
    if (P.x + 0.22 > p.x && P.x - 0.22 < p.x + p.w && p.y <= P.y + 0.001)
      floor = Math.max(floor, p.y);
  const gap = Math.max(0, P.y - floor);
  const t = Math.max(0, 1 - gap / 2.6);
  shadow.position.set(P.x, floor + 0.012, 0);
  shadow.scale.setScalar(0.55 + 0.45 * t);
  shadow.material.opacity = 0.34 * t;

  camera.position.x += (P.x - camera.position.x) * Math.min(1, dt * 6);
  camera.position.y += (P.y + 0.9 - camera.position.y) * Math.min(1, dt * 4);

  pressed = {};
  document.getElementById('state').textContent = bird.current.getClip().name;
  document.getElementById('levelName').textContent =
    LEVEL.name + '  ' + collected.size + '/' + LEVEL.pickups.length +
    (P.reached ? '  \u2014 reunited!' : '');
}

function onResize() {
  renderer.setSize(innerWidth, innerHeight);
  resizeSideCamera(camera, innerWidth / innerHeight, viewHeight());
  document.body.classList.toggle('portrait', innerHeight > innerWidth);
}
addEventListener('resize', onResize);
addEventListener('orientationchange', () => setTimeout(onResize, 120));

let last = performance.now(), acc = 0, frames = 0;
renderer.setAnimationLoop((now) => {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  renderer.render(scene, camera);
  acc += dt; frames++;
  if (acc > 0.5) {
    document.getElementById('fps').textContent = Math.round(frames / acc);
    acc = 0; frames = 0;
  }
});
window.__bird = bird;   // handy for poking at it from the console
window.__player = P;    // used by the automated input tests
window.__level = LEVEL; // ditto: the autoplayer needs the route
// Used by the automated tests, and handy for looking at act two without
// replaying the level first.
window.__bonus = () => bonus;
window.__skipToBonus = () => {
  P.reached = true;
  P.x = LEVEL.goal.x; P.y = LEVEL.goal.y;
  return startBonus();
};
</script>
