<!doctype html>
<meta charset="utf-8">
<title>Mr. Cluckers - three.js</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
  html, body { margin: 0; height: 100%; background: #9cc3dc; overflow: hidden;
               font: 13px/1.5 system-ui, sans-serif; color: #eaf0f4;
               overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
  /* 100dvh so the mobile browser's collapsing toolbar doesn't clip the view. */
  body { height: 100dvh; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hud { position: fixed; left: 0; right: 0; top: 0; padding: 10px 14px;
         display: flex; gap: 8px 18px; flex-wrap: wrap; align-items: center;
         background: linear-gradient(rgba(8,10,14,.75), transparent);
         padding-top: calc(10px + env(safe-area-inset-top, 0px));
         pointer-events: none; }
  body.touch #hud .keyhint { display: none; }
  #rotate { position: fixed; left: 50%; top: 14px; transform: translateX(-50%);
            padding: 7px 14px; border-radius: 999px; font-size: 12px;
            background: rgba(8,10,14,.6); display: none; pointer-events: none;
            padding-top: calc(7px + env(safe-area-inset-top, 0px)); }
  body.touch.portrait #rotate { display: block; }
  body.touch.portrait #hud { display: none; }
  kbd { background: #232831; border: 1px solid #3a414c; border-bottom-width: 2px;
        border-radius: 3px; padding: 1px 6px; font: 11px monospace; }
  b { color: #f0f3f6; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center;
             color: #2c3d4a; font-size: 14px; letter-spacing: .1em;
             text-transform: uppercase; }
  /* Said once, at the start of the bonus round, because nothing else
     explains it. */
  #prompt { position: fixed; left: 0; right: 0; top: 16%; text-align: center;
            background: rgba(20, 26, 32, .55); padding: 14px 10px;
            pointer-events: none; font-family: system-ui, sans-serif; }
  #prompt b { display: block; color: #fffae1; font-size: clamp(15px, 3.2vw, 26px); }
  #prompt span { display: block; margin-top: 6px; color: #d2e6f5;
                 font-size: clamp(11px, 2.2vw, 16px); }
  /* The two round buttons, top right, above everything. The sprite demo has
     had these since it grew a shell; this one had no way to stop and no way
     to shut it up. */
  #tools { position: fixed; right: 12px; display: flex; gap: 8px; z-index: 4;
           top: calc(10px + env(safe-area-inset-top, 0px)); }
  #tools button { width: 40px; height: 40px; border-radius: 999px; padding: 0;
                  font-size: 17px; line-height: 1; cursor: pointer;
                  color: #eaf0f4; background: rgba(8, 10, 14, .62);
                  border: 1px solid rgba(255, 255, 255, .18); }
  #tools button:hover { background: rgba(8, 10, 14, .82); }
  #tools button:focus-visible { outline: 2px solid #ffd76a; outline-offset: 2px; }
  /* Pause and the end of the level share one look. */
  .panel { position: fixed; inset: 0; z-index: 5; display: grid;
           place-items: center; background: rgba(10, 14, 20, .72);
           font-family: system-ui, sans-serif; }
  /* `display: grid` here outranks the browser's own rule for [hidden], so a
     hidden panel stays laid out over the whole screen and quietly eats every
     click. The sprite demo hit this once already. */
  .panel[hidden] { display: none !important; }
  /* The on-screen pad steps out of the way, so a panel is the only thing
     there is to touch. */
  body.halted .tc { display: none; }
  .panel-inner { text-align: center; padding: 26px 30px; max-width: min(92vw, 420px);
                 border-radius: 16px; background: rgba(18, 24, 32, .94);
                 border: 1px solid rgba(255, 255, 255, .12); }
  .panel-inner h2 { margin: 0 0 6px; font-size: clamp(19px, 4vw, 27px);
                    color: #fffae1; }
  .panel-inner .tag { margin: 0 0 16px; color: #b9cbd8; font-size: 13.5px; }
  .panel-inner button { display: block; width: 100%; margin: 8px 0 0;
                        padding: 11px 16px; border-radius: 10px; cursor: pointer;
                        font: inherit; font-size: 15px; border: 0; }
  .panel-inner .big { background: #e0333a; color: #fff; font-weight: 700; }
  .panel-inner .big:hover { background: #c72b32; }
  .panel-inner .quiet { background: rgba(255, 255, 255, .09); color: #dce6ee; }
  .panel-inner .quiet:hover { background: rgba(255, 255, 255, .16); }
  .panel-inner button:focus-visible { outline: 2px solid #ffd76a; outline-offset: 2px; }
</style>
<div id="loading">Loading&hellip;</div>
<div id="hud" hidden>
  <span class="keyhint"><kbd>&larr;</kbd><kbd>&rarr;</kbd> move</span>

  <span>catch him in the ring before he lands</span>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { Cluckers, sideCamera, resizeSideCamera, plushLighting }
  from './mrcluckers.js';

// --- physics, in world units (he is 1.0 unit tall) ------------------------
// Derived from shared/jump.js so the two demos and the editor agree.
const J = window.Jump.C;
const GRAVITY = J.GRAVITY, RUN = J.RUN, WALK = J.WALK;
const ACCEL = J.ACCEL, FRICTION = J.FRICTION;
const JUMPV = J.JUMP_VELOCITY, COYOTE = J.COYOTE, BUFFER = J.JUMP_BUFFER;
const HALF_W = J.HALF_WIDTH;

// Frame by how much of the level should be visible horizontally, not by a
// fixed height -- otherwise a tall phone screen shows almost nothing ahead.
const MIN_WORLD_WIDTH = 6.0, MIN_VIEW_H = 3.6, MAX_VIEW_H = 7.0;

// Actions normally end when their clip does, but `tumble` loops, so it needs
// an explicit limit or he spins forever. Roughly two turns of the clip.
const ACTION_TIME = { tumble: 1.2 };
const ACTION_KEYS = ['peck', 'crow', 'squeak', 'tumble'];

// --- bonus round ----------------------------------------------------------
// Once they are reunited she throws him and you steer. The rules come from
// shared/bonus.js, the same file the sprite demo runs, so the two play the
// same game rather than merely looking alike.
const BONUS_DELAY = 1.4;        // beat between the greeting and act two
let bonus = null, bonusWait = 0;
// The box the round has to fit inside, from the physics rather than a number
// typed here -- the two drifted apart once and the toy left the screen.
let bonusBox = null, catchRing = null;
function measureBonus() {
  // The round's own patch, which is slid inside the level rather than centred
  // on her, so this is asked of the round and not of the config.
  const e = window.Bonus.span(bonus);
  const pad = 0.55;                       // the toy is about a unit across
  bonusBox = {
    left: e.min - pad, right: e.max + pad,
    top: LEVEL.goal.y + window.Bonus.arcHeight() + pad,
    bottom: LEVEL.goal.y - 0.35
  };
}
function viewHeight() {
  const aspect = innerWidth / innerHeight;
  const base = Math.min(MAX_VIEW_H, Math.max(MIN_VIEW_H, MIN_WORLD_WIDTH / aspect));
  if (!bonusBox) return base;
  // Fit the round's box outright: tall enough for the arc, and wide enough
  // for its full sideways range once the aspect is taken into account.
  return Math.max(bonusBox.top - bonusBox.bottom,
                  (bonusBox.right - bonusBox.left) / aspect);
}

// Authored in world units in levels/*.json -- the same file the canvas demo
// and the editor read, so a level only has to be designed once.
const want = (location.search.match(/[?&]level=([\w-]+)/) || [])[1];
const SLUG = (want && window.MRCLUCKERS_LEVELS[want])
  ? want : window.MRCLUCKERS_LEVEL_ORDER[0];
const LEVEL = window.Level.normalize(window.MRCLUCKERS_LEVELS[SLUG]);
const PLATFORMS = LEVEL.platforms;
// The same palette the canvas demo paints with. Without it every level here
// was the same brown dirt under the same green grass, so the kitchen looked
// like the garden.
const THEME = window.Theme ? window.Theme.get(LEVEL.theme) : null;
const part = (kind) => window.Theme ? window.Theme.part(LEVEL.theme, kind) : null;
const collected = new Set();
// Where he comes back to. The level is already in authored units here, so the
// shared rule can read it directly.
const checkpoint = window.Checkpoint ? window.Checkpoint.create(LEVEL) : null;

const coarse = matchMedia('(pointer: coarse)').matches;
const renderer = new THREE.WebGLRenderer({ antialias: true });
// Phones are fill-rate bound long before they are triangle bound, so cap the
// pixel ratio harder on touch devices than on desktop.
renderer.setPixelRatio(Math.min(devicePixelRatio, coarse ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// Sky from the theme: the far colour overhead, the near one on the fog, so
// the level fades into its own horizon rather than a generic blue.
scene.background = new THREE.Color(THEME ? THEME.sky[0] : '#9cc3dc');
scene.fog = new THREE.Fog(THEME ? THEME.sky[1] : '#b8d3e4', 16, 40);
const camera = sideCamera(innerWidth / innerHeight, viewHeight());
plushLighting(scene);

// --- level ---------------------------------------------------------------
// A side-on orthographic camera only ever sees the front face, so the grass
// is a separate cap sitting proud of the dirt rather than a top-face material.
const G = (THEME && THEME.ground) ||
          { dirt: '#6b4b34', edge: '#7d5940', cap: '#5da041', lip: '#7cc55e' };
const dirtMat = new THREE.MeshStandardMaterial({ color: G.dirt, roughness: 1 });
const grassMat = new THREE.MeshStandardMaterial({ color: G.cap, roughness: 1 });
const GRASS = 0.16;
const matCache = new Map();
const mat = (hex, rough = 0.85) => {
  if (!matCache.has(hex)) matCache.set(hex,
    new THREE.MeshStandardMaterial({ color: hex, roughness: rough }));
  return matCache.get(hex);
};
const box = (w, h, d, hex, x, y, z = 0) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(hex));
  m.position.set(x, y, z);
  scene.add(m);
  return m;
};

/* A platform's `kind` says what shape it is; the theme says what it is made
 * of here. The canvas demo draws these five in 2D -- these are the same five
 * as solids, so a level reads as the same place in either demo rather than
 * as a row of identical slabs in one of them. */
for (const p of PLATFORMS) {
  const depth = p.ground ? 3 : 1.2;
  const cx = p.x + p.w / 2;
  const C = part(p.kind);

  if (p.kind === 'slab' && C) {
    // A top on legs, with daylight under it: table, worktop, bench.
    const legW = Math.max(0.08, p.w * 0.09), inset = Math.max(0.06, p.w * 0.07);
    const legH = Math.max(0.05, p.h - 0.17);
    box(legW, legH, depth * 0.5, C.leg, p.x + inset + legW / 2, p.y - 0.17 - legH / 2);
    box(legW, legH, depth * 0.5, C.leg, p.x + p.w - inset - legW / 2, p.y - 0.17 - legH / 2);
    box(p.w, 0.12, depth, C.body, cx, p.y - 0.11);
    box(p.w + 0.05, 0.06, depth + 0.05, C.top, cx, p.y - 0.03);
  } else if (p.kind === 'soft' && C) {
    // Upholstery or foliage: a body with a rounded top and a few tufts.
    const bh = Math.max(0.2, p.h);
    box(p.w, bh - 0.1, depth, C.body, cx, p.y - 0.1 - (bh - 0.1) / 2);
    const roll = new THREE.Mesh(
      new THREE.CylinderGeometry(0.11, 0.11, p.w, 10), mat(C.top));
    roll.rotation.z = Math.PI / 2;
    roll.position.set(cx, p.y - 0.05, 0);
    scene.add(roll);
    for (let t = p.x + 0.22; t < p.x + p.w - 0.15; t += 0.42) {
      const tuft = new THREE.Mesh(new THREE.SphereGeometry(0.09, 8, 5), mat(C.tuft));
      tuft.scale.set(1, 0.55, 1);
      tuft.position.set(t, p.y + 0.01, depth * 0.22);
      scene.add(tuft);
    }
  } else if (p.kind === 'crate' && C) {
    box(p.w, p.h, depth, C.body, cx, p.y - p.h / 2);
    box(p.w, 0.05, depth + 0.04, C.top, cx, p.y - 0.025);
    // Plank lines, as thin proud strips rather than a texture.
    for (let b = p.y - 0.22; b > p.y - p.h + 0.06; b -= 0.22)
      box(p.w + 0.02, 0.03, depth + 0.03, C.line, cx, b);
  } else if (p.kind === 'pipe' && C) {
    const r = Math.max(0.07, Math.min(0.17, p.h * 0.5));
    const tube = new THREE.Mesh(
      new THREE.CylinderGeometry(r, r, p.w, 12), mat(C.body));
    tube.rotation.z = Math.PI / 2;
    tube.position.set(cx, p.y - r, 0);
    scene.add(tube);
    box(p.w - 0.06, 0.05, r * 1.1, C.top, cx, p.y - 0.02);
  } else {
    // `ledge` -- ground, walls, shelves. What every platform used to be.
    box(p.w, p.h, depth, G.dirt, cx, p.y - p.h / 2);
    box(p.w, GRASS, depth + 0.06, G.cap, cx, p.y - GRASS / 2);
    box(p.w, 0.04, depth + 0.08, G.lip, cx, p.y - 0.02);
  }
}

/* Scenery. Never collided with, never scored -- it exists so a level reads
 * as a room or a lane instead of a row of ledges. Props carry their own
 * colours, because a pot plant is a pot plant wherever it stands.
 *
 * Depth is the one thing this demo can do that the canvas cannot: a prop sits
 * behind or in front of the play plane rather than merely being drawn in a
 * different order, so it parallaxes for free as the camera tracks. */
const cyl = (rt, rb, h, hex, x, y, z, seg = 10) => {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat(hex));
  m.position.set(x, y, z);
  scene.add(m);
  return m;
};
const ball = (r, hex, x, y, z, sy = 1) => {
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 9, 6), mat(hex));
  m.scale.y = sy;
  m.position.set(x, y, z);
  scene.add(m);
  return m;
};

for (const d of LEVEL.props) {
  const s = d.scale || 1;
  const x = d.x, y = d.y;
  const z = d.front ? 1.5 : -1.35;      // nearer than him, or behind him
  if (d.kind === 'plant') {
    cyl(0.17 * s, 0.13 * s, 0.32 * s, '#a9603c', x, y + 0.16 * s, z);
    ball(0.13 * s, '#4e8a45', x - 0.14 * s, y + 0.52 * s, z);
    ball(0.15 * s, '#4e8a45', x + 0.02 * s, y + 0.66 * s, z);
    ball(0.12 * s, '#4e8a45', x + 0.15 * s, y + 0.53 * s, z);
  } else if (d.kind === 'lamp') {
    cyl(0.035 * s, 0.035 * s, 1.0 * s, '#5c5148', x, y + 0.5 * s, z);
    cyl(0.02 * s, 0.16 * s, 0.06 * s, '#5c5148', x, y + 0.03 * s, z);
    cyl(0.17 * s, 0.26 * s, 0.34 * s, '#e8cf9a', x, y + 1.17 * s, z);
  } else if (d.kind === 'bowl') {
    cyl(0.24 * s, 0.17 * s, 0.19 * s, '#3f6f96', x, y + 0.09 * s, z);
    cyl(0.15 * s, 0.15 * s, 0.04 * s, '#c9913f', x, y + 0.18 * s, z);
  } else if (d.kind === 'ball') {
    ball(0.15 * s, '#d34a3f', x, y + 0.15 * s, z);
  } else if (d.kind === 'tree') {
    cyl(0.09 * s, 0.12 * s, 1.0 * s, '#6b4a2f', x, y + 0.5 * s, z);
    ball(0.46 * s, '#4f8a3f', x, y + 1.32 * s, z, 0.8);
    ball(0.3 * s, '#4f8a3f', x - 0.32 * s, y + 1.1 * s, z, 0.8);
    ball(0.28 * s, '#63a44f', x + 0.3 * s, y + 1.16 * s, z, 0.8);
  } else if (d.kind === 'flowers') {
    const cols = ['#e8d24a', '#e07ba8', '#f2f2f2', '#e8d24a'];
    [-0.16, -0.04, 0.09, 0.2].forEach((o, i) => {
      cyl(0.015 * s, 0.015 * s, 0.26 * s, '#4e8a45', x + o * s, y + 0.13 * s, z, 6);
      ball(0.06 * s, cols[i], x + o * s, y + 0.29 * s, z);
    });
  } else if (d.kind === 'bin') {
    cyl(0.19 * s, 0.23 * s, 0.52 * s, '#4a5560', x, y + 0.26 * s, z);
    cyl(0.22 * s, 0.22 * s, 0.06 * s, '#5d6b78', x, y + 0.55 * s, z);
  } else if (d.kind === 'post') {
    box(0.11 * s, 0.78 * s, 0.11 * s, '#6d5945', x, y + 0.39 * s, z);
    box(0.26 * s, 0.07 * s, 0.16 * s, '#8a7359', x, y + 0.81 * s, z);
  }
}

/* The parallax backdrop, from the same theme the canvas demo paints.
 *
 * The camera here is orthographic, so putting a layer further away buys
 * nothing on its own -- there is no perspective divide, and a thing at z=-10
 * tracks the camera exactly like a thing at z=0. So the parallax is driven by
 * hand, as it is in 2D: a layer sits at `camX * (1 - speed)`, which leaves
 * speed 1 stuck to the floor and speed 0 painted on the far wall. Depth is
 * still worth setting, because it decides what occludes what.
 *
 * Layers are authored in the canvas demo's world pixels, and `step` is
 * halved when it draws, so both are converted here rather than in the theme.
 */
const PXU = window.Jump.C.PX_PER_HEIGHT;      // world pixels per world unit
const backdrops = [];
if (THEME && THEME.layers) {
  // Wide enough to cover the widest view plus a step either side. The tiles
  // are wrapped under the camera every frame rather than laid end to end
  // across the level, which was hundreds of instances to show about thirty.
  const span = MIN_WORLD_WIDTH * 2 + 8;
  for (const L of THEME.layers) {
    /* Phones are fill-rate bound long before they are triangle bound, and a
     * backdrop layer is a screenful of pixels each. The furthest two are also
     * the most fogged and the least parallaxed -- the ones you would notice
     * least -- so a touch device does without them. */
    if (coarse && (L.speed || 0.4) < 0.25) continue;
    const g = new THREE.Group();
    const speed = L.speed === undefined ? 0.4 : L.speed;
    // Nearer layers sit nearer. Anything marked `front` comes past him.
    g.position.z = L.front ? 1.9 : -2.4 - (1 - Math.min(speed, 1)) * 9;
    const y = -(L.y || 0) / PXU;
    // A translucent layer that fills the screen is the worst thing you can
    // hand a phone: it cannot be depth-rejected, so every pixel behind it is
    // shaded anyway. A background layer only ever composites over the sky, so
    // the alpha is mixed into the colour instead and the layer stays opaque.
    // Front layers pass over him and do need real blending.
    /* Unlit, on purpose. A backdrop layer is a flat silhouette -- it has no
     * form to shade, and it covers most of the screen, so lighting it is a
     * per-pixel cost across the whole viewport for a colour that never
     * changes. `MeshBasicMaterial` is the same picture without that. */
    let hex = L.color;
    if (L.alpha !== undefined && L.alpha < 1 && !L.front) {
      // Fills the screen, so it cannot be depth-rejected and every pixel
      // behind it gets shaded anyway. It only ever sits over the sky, so the
      // alpha is mixed into the colour and the layer stays opaque.
      hex = '#' + new THREE.Color(L.color)
        .lerp(new THREE.Color(THEME.sky[1]), 1 - L.alpha).getHexString();
    }
    const lm = new THREE.MeshBasicMaterial({ color: hex });
    if (L.front && L.alpha !== undefined && L.alpha < 1) {
      lm.transparent = true; lm.opacity = L.alpha;
    }

    if (L.kind === 'band') {
      // A band is a flat stripe of colour. In front of him that is a 2D
      // shading trick -- a darker strip of near floor -- and in 3D it becomes
      // a slab hanging in mid-air, so only the ones behind him are built.
      if (L.front) continue;
      const h = (L.h || 8) / PXU;
      const bar = new THREE.Mesh(new THREE.BoxGeometry(span, h, 0.4), lm);
      bar.position.set(0, y - h / 2, 0);
      g.add(bar);
    } else {
      const step = (L.step || 200) / 2 / PXU;
      const n = Math.max(2, Math.ceil(span / step));
      if (L.kind === 'blobs') {
        /* Hills and canopies are a row of overlapping ellipses. Drawn as N
         * separate discs they cover the screen several times over -- and
         * inside one InstancedMesh three.js cannot sort them, so every one
         * shades pixels the next one paints over. That overdraw, not the
         * triangle count, was halving the frame rate.
         *
         * Drawn as *one* silhouette it is a single unbroken shape: sample the
         * union of the ellipse tops across the span and fill down from it.
         * Same picture, one draw, and no pixel painted twice. */
        const rx = (L.rx || 120) / PXU, ry = (L.ry || 70) / PXU;
        const half = span / 2;
        const shape = new THREE.Shape();
        const STEPS = 160;
        shape.moveTo(-half, y - 14);
        for (let i = 0; i <= STEPS; i++) {
          const px = -half + (span * i) / STEPS;
          // The tallest ellipse over this x wins; that union is the skyline.
          let top = y - 14;
          const first = Math.floor((px - half) / step);
          for (let k = first; k <= first + Math.ceil(span / step) + 1; k++) {
            const cx2 = -half + k * step;
            const d = Math.abs(px - cx2);
            if (d < rx) top = Math.max(top, y + ry * Math.sqrt(1 - (d / rx) ** 2));
          }
          shape.lineTo(px, top);
        }
        shape.lineTo(half, y - 14);
        shape.closePath();
        const hill = new THREE.Mesh(new THREE.ShapeGeometry(shape), lm);
        g.add(hill);
        scene.add(g);
        backdrops.push({ g, speed, step });
        continue;
      }
      let geo;
      if (L.kind === 'panes') {
        geo = new THREE.BoxGeometry((L.w || 140) / PXU, (L.h || 180) / PXU, 0.3);
      } else {                                   // posts
        geo = new THREE.BoxGeometry((L.w || 10) / PXU, (L.h || 60) / PXU, 0.3);
      }
      const inst = new THREE.InstancedMesh(geo, lm, n);
      const t = new THREE.Object3D();
      for (let i = 0; i < n; i++) {
        t.position.set(-span / 2 + i * step, y, 0);
        t.scale.set(1, 1, 1);
        // Boxes are authored from their top edge downward.
        t.position.y = y - ((L.kind === 'panes' ? (L.h || 180) : (L.h || 60)) / PXU) / 2;
        t.updateMatrix();
        inst.setMatrixAt(i, t.matrix);
      }
      inst.instanceMatrix.needsUpdate = true;
      g.add(inst);

      if (L.kind === 'panes' && L.frame) {
        // A frame just behind each pane, a touch larger on every side.
        const fg = new THREE.BoxGeometry((L.w || 140) / PXU + 0.18,
                                         (L.h || 180) / PXU + 0.18, 0.2);
        const fi = new THREE.InstancedMesh(fg, mat(L.frame, 1), n);
        for (let i = 0; i < n; i++) {
          t.position.set(-span / 2 + i * step, y - ((L.h || 180) / PXU) / 2, -0.16);
          t.scale.set(1, 1, 1);
          t.updateMatrix();
          fi.setMatrixAt(i, t.matrix);
        }
        fi.instanceMatrix.needsUpdate = true;
        g.add(fi);
      }
    }
    scene.add(g);
    backdrops.push({ g, speed, step: L.kind === 'band' ? 0
                                   : (L.step || 200) / 2 / PXU });
  }
}

// The other dog at the park: the same model, darkened so nobody mistakes it
// for Ginger, driven by the `trot` clip she just gained.
async function loadOtherDog() {
  const gltf = await new GLTFLoader().loadAsync('../assets/model/ginger.glb');
  let tinted = 0;
  gltf.scene.traverse((o) => {
    if (!o.isMesh || !o.material) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    const swapped = mats.map((m) => {
      const c = m.clone();
      // The colour multiplies the fabric map, so a cool grey darkens the coat
      // without flattening its texture.
      c.color.setHex(0x59606f);
      tinted++;
      return c;
    });
    o.material = Array.isArray(o.material) ? swapped : swapped[0];
  });
  window.__thiefTinted = tinted;
  const pivot = new THREE.Group();
  pivot.rotation.y = -Math.PI / 2;
  pivot.add(gltf.scene);
  const root = new THREE.Group();
  root.add(pivot);
  scene.add(root);

  const mixer = new THREE.AnimationMixer(gltf.scene);
  const actions = {};
  for (const clip of gltf.animations) actions[clip.name] = mixer.clipAction(clip);
  let current = (actions.stand || Object.values(actions)[0]).play();
  const play = (name, fade = 0.18) => {
    const next = actions[name];
    if (!next || next === current) return;
    next.reset().play();
    current.crossFadeTo(next, fade, false);
    current = next;
  };
  return { root, pivot, mixer, play };
}

// --- input ---------------------------------------------------------------
const keys = {}; let pressed = {};
// Sound is the same bed the sprite demo plays, from the same shared voices,
// so the two demos sound alike as well as behaving alike.

// --- pause, and the end of the level --------------------------------------
// There was no way out of a level here but the address bar, and on a phone
// the play view has no address bar. The sprite demo grew this when its shell
// did; this one never had it.
let paused = false;

/** Paused, or the level is over: either way, nothing behind the panel plays. */
function blocked() {
  const done = document.getElementById('done');
  return paused || (done && !done.hidden);
}

function panel(host, title, tag, buttons) {
  host.hidden = false;
  host.innerHTML = '';
  const box = document.createElement('div');
  box.className = 'panel-inner';
  const h = document.createElement('h2');
  h.textContent = title;
  box.appendChild(h);
  if (tag) {
    const p = document.createElement('p');
    p.className = 'tag';
    p.textContent = tag;
    box.appendChild(p);
  }
  for (const [cls, text, fn] of buttons) {
    const b = document.createElement('button');
    b.className = cls;
    b.textContent = text;
    b.addEventListener('click', () => { snd('ui'); fn(); });
    box.appendChild(b);
  }
  host.appendChild(box);
  document.body.classList.add('halted');
  box.querySelector('button').focus();
}

/** How the sprite demo's level select words a finished run. */
function starLine(stats, total) {
  const bits = [stats.kibble + '/' + total + ' kibble'];
  if (stats.bonus) bits.push(stats.bonus + ' at fetch');
  return bits.join(' \u00b7 ');
}

function levelFinished(stats) {
  // Same store, same keys as the sprite demo: finishing The Living Room here
  // unlocks The Kitchen over there. That is the whole point of recording it.
  if (window.Progress) window.Progress.complete(SLUG, stats);
  snd('win');
  const order = window.MRCLUCKERS_LEVEL_ORDER || [];
  const next = window.Progress ? window.Progress.next(order, SLUG) : null;
  const buttons = [];
  if (next) {
    const name = (window.MRCLUCKERS_LEVELS[next] || {}).name || next;
    buttons.push(['big', 'Next: ' + name,
                  () => { location.href = '?level=' + next; }]);
  }
  buttons.push(['quiet', 'Play it again', () => location.reload()]);
  buttons.push(['quiet', 'Level select', () => { location.href = '../?#levels'; }]);
  panel(document.getElementById('done'), LEVEL.name + ' \u2014 done',
        next ? starLine(stats, LEVEL.pickups.length)
             : starLine(stats, LEVEL.pickups.length) +
               " \u2014 that's the last one",
        buttons);
}

function togglePause(force) {
  const want = force === undefined ? !paused : !!force;
  if (want === paused) return;
  // Finishing the level is not something to pause out of.
  if (want && !document.getElementById('done').hidden) return;
  paused = want;
  // Let go of everything, or a key held at the moment you paused stays held.
  // `keys` is shared by reference with the input handlers, so it is emptied
  // in place rather than replaced.
  for (const k in keys) delete keys[k];
  pressed = {};
  const host = document.getElementById('paused');
  if (!paused) {
    host.hidden = true; host.innerHTML = '';
    document.body.classList.remove('halted');
    return;
  }
  snd('ui');
  panel(host, 'Paused', LEVEL.name, [
    ['big', 'Resume', () => togglePause(false)],
    ['quiet', 'Restart level', () => location.reload()],
    // The level select is the sprite demo's shell; this page is one level and
    // a URL. Send them there rather than pretending to have a menu.
    ['quiet', 'Level select', () => { location.href = '../?#levels'; }]
  ]);
}

const MAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  ArrowDown: 'down', KeyS: 'down', ArrowUp: 'jump', KeyW: 'jump', Space: 'jump',
  KeyX: 'peck', KeyC: 'crow', KeyZ: 'squeak', KeyV: 'tumble' };
addEventListener('keydown', e => {
  if (e.code === 'Escape' || e.code === 'KeyP') { togglePause(); e.preventDefault(); return; }
  // The on-screen pad dispatches real key events, so guarding here covers
  // touch as well as the keyboard.
  if (blocked()) return;
  const k = MAP[e.code]; if (!k) return;
  if (!keys[k]) pressed[k] = true; keys[k] = true; e.preventDefault();
});
addEventListener('keyup', e => {
  const k = MAP[e.code]; if (!k) return; keys[k] = false; e.preventDefault();
});

// --- character controller (same shape as the sprite demo) -----------------
const P = { x: LEVEL.spawn.x, y: LEVEL.spawn.y, vx: 0, vy: 0, onGround: true,
            coyote: 0, buffer: 0, landTimer: 0, action: null, actionTime: 0,
            reached: false, stun: 0, hitCool: 0 };
bird.onFinished = (name) => { if (P.action === name) P.action = null; };

function pickState(crouching) {
  if (P.action) return P.action;
  if (!P.onGround) return P.vy > 0.4 ? 'jump' : 'fall';
  if (P.landTimer > 0.12) return 'land';
  if (crouching) return 'crouch';
  const s = Math.abs(P.vx);
  if (s > WALK + 0.4) return 'run';
  if (s > 0.16) return 'walk';
  return 'idle';
}

function startBonus() {
  if (!window.Bonus || !LEVEL.goal) return null;
  bonus = window.Bonus.create();
  // The floor she is standing on, not the level's full width: three of the
  // five levels have a water gap before their last ledge, and the round would
  // lay its patch straight across it.
  bonus.start(LEVEL.goal.x, LEVEL.goal.y,
              window.Level.footing(LEVEL, LEVEL.goal));
  // The level's own kibble would read as treats, so it steps out of the way.
  for (const k of kibbles) k.visible = false;
  // The wildlife stops when she has him back, but the update loop that hides
  // its meshes does not run during the round -- so they would hang there.
  for (const g of critterMeshes) g.visible = false;
  measureBonus();
  onResize();

  // Where he will land, drawn *up* off the ground: this camera is side-on
  // and orthographic, so anything lying flat is edge-on and invisible.
  if (!catchRing) {
    const R = bonus.cfg.catchRadius;
    catchRing = new THREE.Mesh(
      new THREE.BoxGeometry(R * 2, 0.06, 0.06),
      new THREE.MeshBasicMaterial({ color: 0xfff6cf, transparent: true, opacity: 0.8 }));
    catchRing.visible = false;
    scene.add(catchRing);
  }

  onResize();                                   // pull the camera back
  return bonus;
}

function updateBonus(dt) {
  // The toy is a rooster, and the other dog does not care for it: one crow a
  // throw stops it dead. Same button, same meaning as in the level.
  if (pressed.crow) bonus.crow();
  bonus.update(dt, { left: keys.left, right: keys.right });

  // One ring on the ground: where he will land, and where she has to be.
  if (catchRing) {
    const live = bonus.phase === 'flight';
    catchRing.visible = live;
    if (live) {
      const lx = window.Bonus.landing(bonus);
      const under = Math.abs(lx - bonus.dog.x) <= bonus.cfg.catchRadius;
      // Green when she has it, red when the other dog is nearer to it than
      // she is: the ring is the one thing you are watching.
      const rv = bonus.rival;
      const theirs = rv.active && rv.flinch <= 0 &&
                     Math.abs(rv.x - lx) < Math.abs(bonus.dog.x - lx);
      catchRing.position.set(lx, LEVEL.goal.y + 0.02, 0);
      catchRing.material.color.setHex(under ? 0x96f08c : (theirs ? 0xe46056 : 0xfff6cf));
      catchRing.material.opacity = under || theirs ? 1.0 : 0.8;
    }
  }

  for (const e of bonus.drain()) {
    if (e === 'throw') snd('throwUp');
    else if (e === 'catch') { snd('catch'); snd('bark');
                              bird.play('squeak', { restart: true });
                              if (ginger) ginger.play('greet', 0.08); }
    else if (e === 'miss') { snd('miss'); bird.play('land', { restart: true }); }
    else if (e === 'steal') { snd('miss'); snd('bark');
                              bird.play('land', { restart: true }); }
    else if (e === 'flinch') snd('bump');
  }

  // The other dog, running for the same spot she is.
  if (rivalDog) {
    const r = bonus.rival;
    rivalDog.root.visible = r.active;
    if (r.active) {
      rivalDog.root.position.set(r.x, LEVEL.goal.y, 0);
      rivalDog.root.rotation.y = r.dir > 0 ? Math.PI : 0;
      rivalDog.play(Math.abs(r.vx) > 0.4 ? 'trot' : 'stand');
      rivalDog.mixer.update(dt);
    }
  }

  // He is the toy; she is the one you are steering.
  P.x = bonus.toy.x; P.y = bonus.toy.y;
  bird.root.position.set(P.x, P.y, 0);
  const flying = bonus.phase === 'flight';
  if (flying) { bird.play('tumble'); bird.root.rotation.z = bonus.toy.spin; }
  else {
    bird.root.rotation.z = 0;
    if (bird.current.getClip().name === 'tumble') bird.play('idle');
  }
  bird.update(dt);

  if (ginger) {
    ginger.root.position.x = bonus.dog.x;
    ginger.root.rotation.y = bonus.dog.dir > 0 ? Math.PI : 0;
    const running = Math.abs(bonus.dog.vx) > 0.4;
    ginger.play(running ? 'trot' : (bonus.phase === 'wind' ? 'stand' : 'wag'));
    ginger.mixer.update(dt);
  }

  shadow.position.set(P.x, LEVEL.goal.y + 0.012, 0);
  const gap = Math.max(0, P.y - LEVEL.goal.y);
  const st = Math.max(0, 1 - gap / 3.4);
  shadow.scale.setScalar(0.55 + 0.45 * st);
  shadow.material.opacity = 0.34 * st;

  const cx = (bonusBox.left + bonusBox.right) / 2;
  const cy = (bonusBox.top + bonusBox.bottom) / 2;
  camera.position.x += (cx - camera.position.x) * Math.min(1, dt * 6);
  camera.position.y += (cy - camera.position.y) * Math.min(1, dt * 4);

  // Two prompts: how the round works, and -- said again the moment the other
  // dog first turns up -- what it is for.
  const first = bonus.throwIndex === 0, meeting = bonus.throwIndex === bonus.cfg.rivalFrom;
  const prompt = document.getElementById('prompt');
  prompt.hidden = !((first || meeting) && bonus.phase === 'wind');
  if (!prompt.hidden) {
    prompt.querySelector('b').textContent =
      first ? 'Fetch! \u25C0 \u25B6 run Ginger' : 'Here comes the other dog';
    prompt.querySelector('span').textContent =
      first ? 'catch him in the ring before he lands'
            : 'beat it to the ring, or crow to stop it';
  }

  pressed = {};
  document.getElementById('state').textContent = bird.current.getClip().name;
  // The round ending is the end of the level.
  if (bonus.phase === 'done' && !bonus.recorded) {
    bonus.recorded = true;
    levelFinished({ kibble: collected.size, pickups: LEVEL.pickups.length,
                    bonus: bonus.score });
  }

  const total = bonus.total();
  document.getElementById('levelName').textContent =
    (bonus.phase === 'done' ? 'fetch! \u2014 final'
      : 'fetch! throw ' + Math.min(bonus.throwIndex + 1, total) + '/' + total) +
    '  ' + bonus.caught + '/' + total + ' caught' +
    (bonus.lost ? '  \u2014 ' + bonus.lost + ' to the other dog' : '') +
    (bonus.streak > 1 ? '  \u2014 ' + bonus.streak + ' in a row!' : '');
}

let levelClock = 0;

function update(dt) {
  levelClock += dt;
  P.stun = Math.max(0, P.stun - dt);
  P.hitCool = Math.max(0, P.hitCool - dt);
  if (bonus) return updateBonus(dt);

  // The greeting plays out, then a beat, then she picks him up to throw.
  if (P.reached) {
    bonusWait += dt;
    if (bonusWait >= BONUS_DELAY && startBonus()) return;
  }

  const crouching = keys.down && P.onGround;
  // A shove from the vacuum takes the controls away for a moment.
  const steerable = P.stun <= 0;

  // Resolve any action already running first, so a cancelling press takes
  // effect on the same frame rather than the next one.
  if (P.action) {
    P.actionTime += dt;
    const limit = ACTION_TIME[P.action];
    const repeat = pressed[P.action];
    // Jumping outranks a flourish. A direction only shrugs off `tumble`,
    // which is a stun -- otherwise you could never peck on the run.
    const shrugged = repeat || pressed.jump ||
                     (P.action === 'tumble' &&
                      (pressed.left || pressed.right || pressed.down));
    const expired = limit !== undefined && P.actionTime >= limit;
    if (shrugged || expired) {
      // Don't let the same press immediately restart what it cancelled.
      if (repeat) pressed[P.action] = false;
      P.action = null;
    }
  }

  if (!P.action) {
    for (const a of ACTION_KEYS)
      if (pressed[a]) {
        P.action = a;
        P.actionTime = 0;
        if (a === 'squeak') snd('squeak');
        if (a === 'crow') snd('bark');
        bird.play(a, { restart: true });
        break;
      }
  }
  // Actions are cosmetic: they never stop the character. Movement follows the
  // keys that are *held*, so an action fired mid-run keeps the run.
  let target = 0;
  if (!crouching && steerable) { if (keys.left) target -= 1; if (keys.right) target += 1; }
  const speed = keys.down ? WALK : RUN;
  if (target !== 0) {
    P.vx += target * ACCEL * dt;
    if (Math.abs(P.vx) > speed) P.vx = target * speed;
    bird.setFacing(target);
  } else if (P.stun <= 0) {
    // While stunned he keeps whatever the vacuum gave him; friction here
    // scrubbed the shove off almost at once and the hit read as nothing.
    const drop = FRICTION * dt;
    P.vx = Math.abs(P.vx) <= drop ? 0 : P.vx - Math.sign(P.vx) * drop;
  }

  P.coyote = P.onGround ? COYOTE : Math.max(0, P.coyote - dt);
  P.buffer = pressed.jump ? BUFFER : Math.max(0, P.buffer - dt);
  if (P.buffer > 0 && P.coyote > 0) {
    P.vy = JUMPV; P.onGround = false; P.coyote = 0; P.buffer = 0;
    snd('jump');
  }
  if (P.vy > 0 && !keys.jump) P.vy -= GRAVITY * 1.6 * dt;

  P.vy -= GRAVITY * dt;
  P.x += P.vx * dt;
  const prevY = P.y;
  P.y += P.vy * dt;

  const wasAir = !P.onGround;
  const wasRiding = P.riding;
  P.onGround = false;
  P.riding = null;
  if (P.vy <= 0) {
    for (const p of PLATFORMS) {
      if (P.x + 0.22 > p.x && P.x - 0.22 < p.x + p.w &&
          prevY >= p.y - 0.001 && P.y <= p.y) {
        P.y = p.y; P.vy = 0; P.onGround = true;
        break;
      }
    }
    // The top of a vacuum is a surface too. `Patrol.hits` has always treated
    // being above one as safe; this makes that space stand on, which turns
    // the thing you were dodging into the thing that carries you.
    if (!P.onGround) {
      for (const m of LEVEL.patrols) {
        const d = window.Patrol.deck(m, levelClock);
        if (Math.abs(P.x - d.x) < d.halfW + 0.14 &&
            prevY >= d.y - 0.08 && P.y <= d.y) {
          P.y = d.y; P.vy = 0; P.onGround = true; P.riding = m;
          break;
        }
      }
    }
    if (P.onGround && wasAir) { P.landTimer = 0.26; snd('land'); }
  }
  // Carried by whatever he is standing on, taken as the deck's own movement
  // over this frame so he keeps station on it through the turnaround pause.
  if (P.riding) P.x += window.Patrol.drift(P.riding, levelClock - dt, levelClock);
  if (wasRiding && !P.riding && P.vy > 0) {
    // Stepping off keeps some of the machine's motion: a ride throws him
    // further than a standing jump, which is what makes it worth doing.
    P.vx += window.Patrol.drift(wasRiding, levelClock - dt, levelClock)
            / Math.max(dt, 0.001) * 0.5;
  }
  // Hazards and falling out of the world put him back at the start.
  // The vacuum: drive each machine from the shared clock, then see if it
  // caught him. Not lethal -- it bats him back down the room. Being above one
  // is safe and standing on one is a ride, so the counterplay is to time the
  // gap, jump it, or get on top of it.
  for (const v of vacuums) {
    const { m, lamp, bumper } = v.userData;
    const here = window.Patrol.at(m, levelClock);
    v.position.x = here.x;
    bumper.position.x = here.dir * window.Patrol.CFG.radius * 0.7;
    lamp.material.color.setHex(
      here.turning ? (Math.floor(performance.now() / 180) % 2 ? 0xffd34d : 0x6b5a20)
                   : 0x7fd46b);
    if (P.hitCool > 0 || P.riding === m) continue;
    if (!window.Patrol.hits(m, levelClock, P.x, P.y, HALF_W)) continue;
    const k = window.Patrol.knockFrom(here, P.x);
    P.vx = k.vx; P.vy = k.vy; P.onGround = false; P.stun = k.stun;
    P.hitCool = window.Patrol.CFG.immune;
    P.action = 'tumble'; P.actionTime = 0;
    snd('bump');
    bird.play('tumble', { restart: true });
  }

  // He drowns when he is *in* the water, not when he is level with it: a
  // hazard's edge plus his half-width overlaps the ledge beside it, so the
  // bank itself used to be lethal and a flush water gap was uncrossable.
  let inHazard = false;
  for (const h of LEVEL.hazards)
    if (P.x + HALF_W > h.x && P.x - HALF_W < h.x + h.w &&
        P.y < h.y - 0.08 && P.y > h.y - h.h - 0.4) inHazard = true;
  if (checkpoint) {
    checkpoint.consider(P.x, P.y, P.onGround && P.stun <= 0, dt);
  }
  if (P.y < -6 || inHazard) {
    // Back to the last place he stood safely, not the start of the level.
    const back = checkpoint ? checkpoint.respawn()
                            : { x: LEVEL.spawn.x, y: LEVEL.spawn.y, grace: 0 };
    P.x = back.x; P.y = back.y; P.vx = P.vy = 0; P.action = null;
    P.stun = 0;
    P.hitCool = back.grace;         // don't get hit the moment you arrive
    snd(inHazard ? 'splash' : 'land');
  }

  for (const k of kibbles) {
    if (!k.visible) continue;
    if (distraction && distraction.lost(k.userData.index)) continue;
    if (Math.abs(k.position.x - P.x) < 0.36 &&
        Math.abs(k.position.y - (P.y + 0.5)) < 0.55) {
      k.visible = false;
      collected.add(k.userData.index);
      snd('kibble');
      if (!P.action) { P.action = 'squeak'; P.actionTime = 0;
                       bird.play('squeak', { restart: true }); }
    }
  }
  for (const t of thieves) {
    const held = t.state.carrying;
    t.state.update(dt, { x: P.x, y: P.y, onGround: P.onGround,
                         safe: P.hitCool > 0 });
    if (t.state.carrying && !held) snd('grab');   // the moment it gets him
    t.root.position.x = t.state.x;
    t.pivot.rotation.y = t.state.dir > 0 ? -Math.PI / 2 : Math.PI / 2;
    t.play(t.state.clip());
    t.mixer.update(dt);
    if (t.state.carrying) {
      // He is in its mouth: no steering, and he plays along.
      const hold = t.state.carryPoint();
      P.x = hold.x; P.y = hold.y; P.vx = 0; P.vy = 0; P.onGround = false;
      P.stun = Math.max(P.stun, 0.1);
      P.hitCool = Math.max(P.hitCool, 0.6);
      if (bird.current.getClip().name !== 'tumble') bird.play('tumble');
    }
  }

  if (distraction) {
    const stolenBefore = distraction.stolen.length;
    distraction.update(dt, { x: P.x, y: P.y + 0.45,
                             taken: (i) => collected.has(i) });
    if (distraction.stolen.length > stolenBefore) snd('bump');
    for (let i = 0; i < critterMeshes.length; i++) {
      const c = distraction.critters[i], g = critterMeshes[i];
      g.visible = c.here;
      if (!c.here) continue;
      g.position.set(c.x, c.y, 0);
      g.rotation.y = c.dir > 0 ? 0 : Math.PI;
      g.userData.carried.visible = c.carry >= 0;
      const wings = g.userData.wings;
      if (wings) {
        // Out and beating in the air, folded flat once it has landed.
        const flap = c.flying ? Math.sin(levelClock * 22) * 0.6 : -0.15;
        wings[0].rotation.x = -flap;
        wings[1].rotation.x = flap;
      }
    }
    // Anything carried off is gone: take it out of the level for good.
    for (const i of distraction.stolen) {
      if (kibbles[i]) kibbles[i].visible = false;
    }
    // A squeak fetches her back, if he is close enough to be heard over it.
    if (pressed.squeak && distraction.squeak(P.x) && ginger) ginger.play('greet', 0.08);
    // And a crow puts up every bird within earshot, ending its visit and any
    // theft it was halfway through.
    if (pressed.crow && distraction.scare(P.x, P.y + 0.45).length) snd('bump');
    // She turns to whatever has her attention.
    if (ginger) {
      ginger.root.rotation.y =
        (distraction.watcher && distraction.watcher.home.x >= LEVEL.goal.x) ? Math.PI : 0;
    }
  }
  if (ginger) {
    ginger.mixer.update(dt);
    if (!P.reached && Math.abs(LEVEL.goal.x - P.x) < 0.6 &&
        Math.abs(LEVEL.goal.y - P.y) < 0.9 &&
        (!distraction || distraction.onYou())) {
      P.reached = true;
      snd('bark');
      if (distraction) distraction.finish();
      P.action = 'crow';
      P.actionTime = 0;
      bird.play('crow', { restart: true });
      ginger.play('greet', 0.08);
    }
  }
  P.landTimer = Math.max(0, P.landTimer - dt);

  bird.play(pickState(crouching));
  bird.root.position.set(P.x, P.y, 0);
  bird.update(dt);

  // Shadow sits on whatever surface is under him and fades with height.
  let floor = -6;
  for (const p of PLATFORMS)
    if (P.x + 0.22 > p.x && P.x - 0.22 < p.x + p.w && p.y <= P.y + 0.001)
      floor = Math.max(floor, p.y);
  const gap = Math.max(0, P.y - floor);
  const t = Math.max(0, 1 - gap / 2.6);
  shadow.position.set(P.x, floor + 0.012, 0);
  shadow.scale.setScalar(0.55 + 0.45 * t);
  shadow.material.opacity = 0.34 * t;

  // Lean toward her while a squirrel has her, so the thing you are being
  // told about is actually in shot. This camera frames tighter than the
  // sprite demo's, and the squirrel sits just behind her.
  const nearHer = distraction && distraction.watching && LEVEL.goal &&
                  Math.abs(LEVEL.goal.x - P.x) < 4;
  const lean = nearHer ? 1.1 : 0;
  // A bird perches over her head, and this camera frames tighter than the
  // sprite demo's -- without a lift it is above the top of the screen, and
  // you cannot see the thing you are being told to squeak at. How far it sits
  // above her is authored per perch, so the lift follows it.
  const lift = nearHer
    ? Math.max(0, Math.min(1.8, distraction.watcher.home.y - LEVEL.goal.y - 0.5))
    : 0;
  camera.position.x += ((P.x + lean) - camera.position.x) * Math.min(1, dt * 6);
  camera.position.y += (P.y + 0.9 + lift - camera.position.y) * Math.min(1, dt * 4);

  // Drive the backdrop by hand: an orthographic camera gets no parallax from
  // depth, so each layer is slid to `camX * (1 - speed)`. Speed 1 stays put
  // against the floor, speed 0 is painted on the far wall, and anything over
  // 1 slides past faster than he runs.
  for (const L of backdrops) {
    const cx = camera.position.x;
    // Follow the camera, then step back by however far into the current tile
    // the parallax has travelled. Over one camera unit that nets out to
    // (1 - speed) of movement, which is the parallax, but the tiles never
    // leave the view so only a screenful of them has to exist.
    L.g.position.x = L.step ? cx - (cx * L.speed) % L.step : cx * (1 - L.speed);
    L.g.position.y = camera.position.y * 0.14;   // a touch of vertical drift
  }

  pressed = {};
  document.getElementById('state').textContent = bird.current.getClip().name;
  let note = '';
  if (P.reached) note = '  \u2014 reunited!';
  else if (distraction && distraction.watching && LEVEL.goal &&
           Math.abs(LEVEL.goal.x - P.x) < 6) {
    note = distraction.watcher.kind === 'bird'
      ? "  \u2014 she's watching a bird. Squeak, or crow to put it up!"
      : "  \u2014 she's watching a squirrel. Squeak!";
  } else if (distraction) {
    const thief = distraction.pressing();
    if (thief) {
      note = thief.kind === 'bird'
        ? '  \u2014 a bird is after your kibble. Crow at it!'
        : '  \u2014 a squirrel is after your kibble. Run it off!';
    } else if (distraction.stolen.length) {
      note = '  \u2014 ' + distraction.stolen.length + ' lost to the wildlife';
    }
  }
  document.getElementById('levelName').textContent =
    LEVEL.name + '  ' + collected.size + '/' + LEVEL.pickups.length + note;
}

function onResize() {
  renderer.setSize(innerWidth, innerHeight);
  resizeSideCamera(camera, innerWidth / innerHeight, viewHeight());
  document.body.classList.toggle('portrait', innerHeight > innerWidth);
}
addEventListener('resize', onResize);
addEventListener('orientationchange', () => setTimeout(onResize, 120));

let last = performance.now(), acc = 0, frames = 0;
renderer.setAnimationLoop((now) => {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!paused) update(dt);        // still drawn, so the frozen frame shows
  renderer.render(scene, camera);
  acc += dt; frames++;
  if (acc > 0.5) {
    document.getElementById('fps').textContent = Math.round(frames / acc);
    acc = 0; frames = 0;
  }
});
window.__bird = bird;   // handy for poking at it from the console
window.__player = P;
window.__backdrops = backdrops;   // for the per-layer cost check
window.__renderer = renderer;   // draw calls and triangles, for the perf check
// For the automated look-at-it checks: how much got built, and in what sky.
window.__scene = scene;
window.__sky = THEME ? THEME.sky[0] : null;    // used by the automated input tests
window.__level = LEVEL; // ditto: the autoplayer needs the route
window.__camera = camera;            // to check the bird is actually in shot
window.__clock = () => levelClock;   // to line a jump up against a machine
window.__checkpoint = () => (checkpoint ? checkpoint.at : null);
window.__distraction = () => distraction;
// The meshes and the kibble, so a test can tell that what the shared module
// says and what is actually on screen are the same thing.
window.__critterMeshes = critterMeshes;
window.__kibbles = kibbles;
window.__thieves = () => thieves.map((t) => t.state);
// Used by the automated tests, and handy for looking at act two without
// replaying the level first.
window.__bonus = () => bonus;
window.__skipToBonus = () => {
  P.reached = true;
  P.x = LEVEL.goal.x; P.y = LEVEL.goal.y;
  return startBonus();
};
</script>
